services:
  - type: web
    name: atelie-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Database__AutoMigrate
        value: "true"
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Firebase__ProjectId
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false

  - type: web
    name: atelie-landing
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/landing/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_INTERNAL_URL
        sync: false

  - type: web
    name: atelie-painel
    runtime: static
    buildCommand: npm ci && npm run build -w @atelie/dashboard
    staticPublishPath: frontend/dashboard/dist
    envVars:
      - key: NODE_VERSION
        value: "24.13.0"
      - key: VITE_API_URL
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
