<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psicopedagoga Alexandra G. S. de Fraga</title>
  <style>
    :root {
      --navy: #092e61;
      --green-whats: #25d366;
      --paper: #fffefa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: #e9edf4;
      color: var(--navy);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    .card {
      width: min(100%, 720px);
      margin: auto;
      background: var(--paper);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 55px #172b4930;
    }
    .poster {
      display: block;
      width: 100%;
      height: auto;
    }
    .contato {
      padding: 22px 20px 26px;
      text-align: center;
    }
    .contato h2 {
      margin: 0 0 14px;
      font-size: clamp(18px, 3vw, 24px);
    }
    .whats {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green-whats);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(17px, 2.8vw, 22px);
      padding: 14px 28px;
      border-radius: 60px;
      box-shadow: 0 6px 18px #25d36655;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .whats:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px #25d36677;
    }
    .whats .icon { font-size: 1.3em; }
    .contato small {
      display: block;
      margin-top: 12px;
      font-family: Georgia, serif;
      font-style: italic;
      color: #4c5a70;
      font-size: 14px;
    }
    .edit-note {
      max-width: 720px;
      margin: 14px auto 0;
      color: #4c5a70;
      font: 14px Arial, sans-serif;
      text-align: center;
    }
    @media (max-width: 650px) {
      body { padding: 0; background: white; }
      .card { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="poster" src="assets/Psicopedagogia_ Aprender e Conquistar.png"
         alt="Cartaz: Psicopedagoga Alexandra G. S. de Fraga — Avaliação e Intervenção Personalizada, Estímulo às Habilidades Cognitivas, Apoio no Aprendizado Escolar, Desenvolvimento da Autonomia e da Autoestima">

    <section class="contato">
      <h2>☎ Entre em contato!</h2>
      <a class="whats" href="https://wa.me/5551981343844" target="_blank" rel="noopener">
        <span class="icon">💬</span> WhatsApp (51) 98134-3844
      </a>
      <small>Vamos juntos construir novas conquistas!</small>
    </section>
  </main>
  <p class="edit-note">Para editar, abra este arquivo no VS Code e altere os textos e cores no início do CSS.</p>
</body>
</html>
