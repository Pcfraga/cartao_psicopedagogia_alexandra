services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atelie}
      POSTGRES_USER: ${POSTGRES_USER:-atelie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-atelie};Username=${POSTGRES_USER:-atelie};Password=${POSTGRES_PASSWORD}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no arquivo .env}
      Database__AutoMigrate: "true"
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  landing:
    build:
      context: .
      dockerfile: frontend/landing/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: frontend/dashboard/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5080}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:3000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Defina VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Defina VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Defina VITE_FIREBASE_PROJECT_ID}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres-data:
